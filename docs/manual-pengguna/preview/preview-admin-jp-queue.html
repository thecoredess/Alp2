<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <title>Giliran Semakan Admin JP</title>
  <link rel="stylesheet" href="_base.css">
</head>
<body>
  <div class="shell" style="max-width:1000px;margin:16px auto;">
    <main class="main" style="padding:20px 24px;">
      <span class="badge-demo">Pratonton skrin sistem</span>
      <h1 class="page-title">Semakan Urusetia</h1>
      <p class="sub">Admin JP · Permohonan berstatus <strong>Dihantar</strong></p>
      <form style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        <input class="inp" style="width:180px" placeholder="No. / penerima…" value="">
        <select class="inp" style="width:120px"><option>2026</option></select>
        <button type="button" class="btn btn-primary">Tapis</button>
      </form>
      <div class="card" style="padding:0;overflow:hidden;">
        <table class="data">
          <thead>
            <tr>
              <th>No. Permohonan</th>
              <th>Penerima</th>
              <th>ALP</th>
              <th style="text-align:right">Jumlah</th>
              <th style="text-align:right">Tindakan</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="font-family:Consolas;font-size:12px">SUM/2026/000142</td>
              <td>Persatuan Kebajikan Komuniti Sentul</td>
              <td>ALP-01</td>
              <td style="text-align:right">RM 2,500.00</td>
              <td style="text-align:right"><span class="btn btn-primary">Semak</span></td>
            </tr>
            <tr>
              <td style="font-family:Consolas;font-size:12px">SUM/2026/000138</td>
              <td>Persatuan Sukan Wanita KL</td>
              <td>ALP-03</td>
              <td style="text-align:right">RM 1,800.00</td>
              <td style="text-align:right"><span class="btn btn-primary">Semak</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
